{% load static %}
<header class="site-header">
    <div class="container-fluid site-header-inner">
        <a class="site-brand" href="{% url 'indexA' %}">
            <img src="{% static 'images/LOGO TEC2 RED.png' %}" alt="" class="site-brand-mark">
            <span>
                <strong>TecNM</strong>
                <small>Campus Chihuahua II</small>
            </span>
        </a>
        <div class="site-account">
            {% if user.is_authenticated %}
                <span class="site-user"><i class="bi bi-person-circle" aria-hidden="true"></i> {{ user.get_username }}</span>
                <a class="site-account-link" href="{% url 'logout' %}">Cerrar sesión</a>
            {% else %}
                <a class="site-account-link" href="{% url 'log_in' %}">Iniciar sesión</a>
            {% endif %}
        </div>
    </div>
    <nav class="site-navigation" aria-label="Navegación principal">
        <a class="nav-link" href="{% url 'indexA' %}">Inicio</a>
        <a class="nav-link" href="{% url 'dashboard2' %}">Servicios escolares</a>
        <a class="nav-link" href="{% url 'gestion_docentes' %}">Gestión docente</a>
        <a class="nav-link" href="{% url 'biblioteca' %}">Biblioteca</a>
        <a class="nav-link" href="{% url 'tramites' %}">Trámites</a>
    </nav>
</header>
